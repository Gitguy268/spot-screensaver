name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [macOS screen saver, Browser]
    validations:
      required: true
  - type: dropdown
    id: style
    attributes:
      label: Style
      options: [3D, Vector, Both]
  - type: input
    id: system
    attributes:
      label: Browser or macOS version, and the Mac
      placeholder: macOS 26.2 on a MacBook Air M4 / Safari 26 / Chrome 142
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
